<div *ngIf="services.length > 0">
  @for (service of services; track service) {
    <app-service-item
      [service]="service"
      (deleteEmitter)="deleteService($event)"
      (updateEmitter)="updateService($event)"
    >
    </app-service-item>
  }
</div>
<div *ngIf="services.length === 0">
  <app-no-result
    [label]="'Trenutno nema usluga za ovog frizera.'"
  >
  </app-no-result>
</div>
