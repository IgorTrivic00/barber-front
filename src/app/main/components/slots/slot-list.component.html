<div class="time-slots-section">
  <div class="time-slots">
    <ng-container *ngFor="let slot of slots">
      <app-slot-item
        [slot]="slot"
        (selectEmitter)="selectSlot($event)"
      >
      </app-slot-item>
    </ng-container>
    <ng-container *ngIf="slots?.length === 0">
      <app-no-result
        [label]="'Nema slobodnih mesta za ovaj dan'"
      >
      </app-no-result>
    </ng-container>
  </div>
</div>
