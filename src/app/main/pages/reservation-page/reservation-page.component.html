<div>
  <div style="padding: 10px; position: fixed; z-index: 1000; top: 0; left: 0">
    <p-button icon="pi pi-arrow-left" iconPos="left" severity="secondary" (click)="return()"
              label="Nazad" [raised]="true" [style]="{'border-radius': '0.25rem'}"/>
  </div>
  <h4 class="barber-service-header">{{barber?.name}} - {{service?.serviceName}}</h4>
  <div class="calendar">
    <p-calendar
      class="max-w-full"
      [inline]="true"
      selectionMode="single"
      (onSelect)="onCalendarChange($event)"
      [minDate]="nowDate"/>
  </div>

  <app-slot-list
    [slots]="slots"
    (selectEmitter)="selectSlot($event)"
  >
  </app-slot-list>

  <div *ngIf="selectedTimeSlot" class="save-button">
    <p-button label="Nastavi" (onClick)="scheduleAppointment()"
              [raised]="true" [style]="{'width': '100%', 'border-radius': '0.25rem'}"/>
  </div>
</div>
